name: Weekly Agentic AI Report

on:
  schedule:
    # 11:00 Asia/Shanghai every Monday.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      report_only:
        description: "Generate the report without publishing, PR creation, or DingTalk notification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-agentic-ai-report
  cancel-in-progress: false

jobs:
  weekly-update:
    name: Run weekly update
    # Set repository variable WEEKLY_RUNNER to an internal self-hosted runner
    # label when ClickHouse, Yuque, or DingTalk are only reachable on intranet.
    runs-on: ${{ vars.WEEKLY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90

    env:
      GITHUB_TOKEN: ${{ secrets.WEEKLY_GITHUB_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.WEEKLY_GITHUB_TOKEN || github.token }}
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      OPENAI_TIMEOUT: ${{ vars.OPENAI_TIMEOUT || '180' }}
      ALLOW_LLM_FALLBACK: ${{ vars.ALLOW_LLM_FALLBACK || 'true' }}
      LLM_REPORT_PROJECT_LIMIT: ${{ vars.LLM_REPORT_PROJECT_LIMIT || '18' }}
      YUQUE_BOOK_ID: ${{ secrets.YUQUE_BOOK_ID || vars.YUQUE_BOOK_ID || '211551637' }}
      YUQUE_API_TOKEN: ${{ secrets.YUQUE_API_TOKEN }}
      YUQUE_API_BASE: ${{ vars.YUQUE_API_BASE || 'https://www.yuque.com/api/v2' }}
      YUQUE_WEB_BASE: ${{ vars.YUQUE_WEB_BASE || 'https://yuque.antfin.com' }}
      YUQUE_NAMESPACE: ${{ vars.YUQUE_NAMESPACE }}
      YUQUE_PARENT_URL: ${{ vars.YUQUE_PARENT_URL }}
      YUQUE_PARENT_SLUG: ${{ vars.YUQUE_PARENT_SLUG }}
      YUQUE_PARENT_TITLE: ${{ vars.YUQUE_PARENT_TITLE || 'Agentic 每周推送' }}
      YUQUE_PARENT_UUID: ${{ vars.YUQUE_PARENT_UUID }}
      YUQUE_PARENT_NODE_UUID: ${{ vars.YUQUE_PARENT_NODE_UUID }}
      YUQUE_DOC_PUBLIC: ${{ vars.YUQUE_DOC_PUBLIC }}
      YUQUE_PUBLISH_COMMAND: ${{ secrets.YUQUE_PUBLISH_COMMAND }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WEEKLY_GITHUB_TOKEN || github.token }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required configuration
        run: |
          missing=0
          for name in GITHUB_TOKEN CLICKHOUSE_HOST CLICKHOUSE_USER CLICKHOUSE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [ -z "$YUQUE_API_TOKEN" ] && [ -z "$YUQUE_PUBLISH_COMMAND" ]; then
            echo "::error::YUQUE_API_TOKEN or YUQUE_PUBLISH_COMMAND is required for the full publishing workflow"
            missing=1
          fi
          for name in DINGTALK_WEBHOOK DINGTALK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [ -z "$OPENAI_API_KEY" ] && [ "$ALLOW_LLM_FALLBACK" != "true" ]; then
            echo "::error::OPENAI_API_KEY is required when ALLOW_LLM_FALLBACK is not true"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run weekly update
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.report_only }}" = "true" ]; then
            python scripts/weekly_update.py --check --report-only
          else
            python scripts/weekly_update.py --check
          fi

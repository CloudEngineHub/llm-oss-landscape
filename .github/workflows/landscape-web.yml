name: Landscape web

on:
  pull_request:
    paths:
      - "apps/landscape-web/**"
      - "data/agentic-ai-projects.csv"
      - ".github/workflows/landscape-web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/landscape-web/**"
      - "data/agentic-ai-projects.csv"
      - ".github/workflows/landscape-web.yml"

permissions:
  contents: read

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landscape-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landscape-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  insights-api:
    name: Insights API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landscape-web/services/insights-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landscape-web/services/insights-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

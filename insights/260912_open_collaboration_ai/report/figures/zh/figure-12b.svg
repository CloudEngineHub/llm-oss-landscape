<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="按第一次正式 reviewer 比较后续 commit"><rect width="1600" height="900" fill="#fbfaf6"/><rect x="64" y="54" width="10" height="58" rx="5" fill="#7058ff"/><text x="100" y="96" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="42" font-weight="600" text-anchor="start"><tspan x="100" dy="0">按第一次正式 reviewer 比较后续 commit</tspan></text><line x1="64" y1="166" x2="1536" y2="166" stroke="#d7dbe5"/><rect x="80" y="210" width="700" height="315" rx="22" fill="#fde8f7" stroke="#172033"/><text x="110" y="270" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="110" dy="0">具名 Agent 或 App</tspan></text><text x="110" y="385" fill="#7058ff" font-family="Arial, PingFang SC, sans-serif" font-size="72" font-weight="600" text-anchor="start"><tspan x="110" dy="0">66.8%</tspan></text><text x="110" y="445" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="110" dy="0">834 of 1,249 PRs received another commit</tspan></text><rect x="110" y="475" width="640" height="18" rx="9" fill="#e8e6e0"/><rect x="110" y="475" width="427.52" height="18" rx="9" fill="#7058ff"/><rect x="820" y="210" width="700" height="315" rx="22" fill="#e4f2ff" stroke="#172033"/><text x="850" y="270" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="850" dy="0">GitHub User 账号</tspan></text><text x="850" y="385" fill="#488dcc" font-family="Arial, PingFang SC, sans-serif" font-size="72" font-weight="600" text-anchor="start"><tspan x="850" dy="0">41.1%</tspan></text><text x="850" y="445" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="850" dy="0">457 of 1,111 PRs received another commit</tspan></text><rect x="850" y="475" width="640" height="18" rx="9" fill="#e8e6e0"/><rect x="850" y="475" width="263.04" height="18" rx="9" fill="#488dcc"/><line x1="80" y1="585" x2="1520" y2="585" stroke="#d7dbe5"/><text x="80" y="675" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="38" font-weight="600" text-anchor="start"><tspan x="80" dy="0">70.7%</tspan></text><text x="80" y="730" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="80" dy="0">出现正式 Review</tspan></text><text x="80" y="790" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="80" dy="0">2,521 / 3,567 PR</tspan></text><line x1="540" y1="605" x2="540" y2="810" stroke="#d7dbe5"/><text x="560" y="675" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="38" font-weight="600" text-anchor="start"><tspan x="560" dy="0">37.6%</tspan></text><text x="560" y="730" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="560" dy="0">出现 Agent Review 或行内 Review 评论</tspan></text><text x="560" y="790" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="560" dy="0">1,342 / 3,567 PR</tspan></text><line x1="1020" y1="605" x2="1020" y2="810" stroke="#d7dbe5"/><text x="1040" y="675" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="38" font-weight="600" text-anchor="start"><tspan x="1040" dy="0">54.9%</tspan></text><text x="1040" y="730" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="1040" dy="0">第一次正式 Review 后又有 commit</tspan></text><text x="1040" y="790" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1040" dy="0">1,385 / 2,521 个已 Review PR</tspan></text></svg>
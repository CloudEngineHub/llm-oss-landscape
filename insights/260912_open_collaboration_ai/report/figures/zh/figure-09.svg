<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="围绕任务的开放基础设施项目"><rect width="1600" height="900" fill="#fbfaf6"/><rect x="64" y="54" width="10" height="58" rx="5" fill="#7058ff"/><text x="100" y="96" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="42" font-weight="600" text-anchor="start"><tspan x="100" dy="0">围绕任务的开放基础设施项目</tspan></text><line x1="64" y1="166" x2="1536" y2="166" stroke="#d7dbe5"/><rect x="70" y="230" width="350" height="510" rx="22" fill="#ece9ff" stroke="#d7dbe5"/><text x="94" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="94" dy="0">运行与隔离</tspan></text><text x="94" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="94" dy="0">Kubernetes Agent Sandbox；Kata</tspan><tspan x="94" dy="22.5">Containers；Confidential</tspan><tspan x="94" dy="22.5">Containers</tspan></text><text x="94" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="94" dy="0">Sandbox 生命周期和 warm pool；VM</tspan><tspan x="94" dy="21.6">级隔离；面向敏感 AI 工作负载的机密计算基础</tspan></text><rect x="450" y="230" width="350" height="510" rx="22" fill="#e4f2ff" stroke="#d7dbe5"/><text x="474" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="474" dy="0">协调与运行</tspan></text><text x="474" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="474" dy="0">kagent；Dapr Agents；OpenChoreo</tspan></text><text x="474" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Agent 操作</tspan><tspan x="474" dy="21.6">Kubernetes、Prometheus、Istio 和</tspan><tspan x="474" dy="21.6">Argo；durable workflow、状态、重试和</tspan><tspan x="474" dy="21.6">SPIFFE identity；同一平台以不同接口服务人和</tspan><tspan x="474" dy="21.6">Agent</tspan></text><rect x="830" y="230" width="350" height="510" rx="22" fill="#fde8f7" stroke="#d7dbe5"/><text x="854" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="854" dy="0">连接与治理</tspan></text><text x="854" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="854" dy="0">kgateway；agentgateway；Istio</tspan></text><text x="854" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="854" dy="0">LLM、MCP 和 Agent 流量的控制面与数据面；service</tspan><tspan x="854" dy="21.6">mesh 和 gateway policy 延伸到 AI 工作负载</tspan></text><rect x="1210" y="230" width="350" height="510" rx="22" fill="#e7f5ee" stroke="#d7dbe5"/><text x="1234" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="1234" dy="0">追踪与解释</tspan></text><text x="1234" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="1234" dy="0">OpenTelemetry；Jaeger</tspan></text><text x="1234" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1234" dy="0">Agent、workflow 和 execute-tool</tspan><tspan x="1234" dy="21.6">语义；成熟 tracing 项目把 UI 与协议层扩展到 Agent</tspan><tspan x="1234" dy="21.6">执行路径</tspan></text></svg>
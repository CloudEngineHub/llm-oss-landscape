<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Open infrastructure projects around the task"><rect width="1600" height="900" fill="#fbfaf6"/><rect x="64" y="54" width="10" height="58" rx="5" fill="#7058ff"/><text x="100" y="96" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="42" font-weight="600" text-anchor="start"><tspan x="100" dy="0">Open infrastructure projects around the task</tspan></text><line x1="64" y1="166" x2="1536" y2="166" stroke="#d7dbe5"/><rect x="70" y="230" width="350" height="510" rx="22" fill="#ece9ff" stroke="#d7dbe5"/><text x="94" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="94" dy="0">Run and isolate</tspan></text><text x="94" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="94" dy="0">Kubernetes Agent Sandbox Kata</tspan><tspan x="94" dy="22.5">Containers Confidential</tspan><tspan x="94" dy="22.5">Containers</tspan></text><text x="94" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="94" dy="0">Sandbox lifecycle and warm pools;</tspan><tspan x="94" dy="21.6">VM-backed isolation; an attested</tspan><tspan x="94" dy="21.6">confidential-computing substrate</tspan><tspan x="94" dy="21.6">for sensitive AI workloads</tspan></text><rect x="450" y="230" width="350" height="510" rx="22" fill="#e4f2ff" stroke="#d7dbe5"/><text x="474" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="474" dy="0">Coordinate and operate</tspan></text><text x="474" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="474" dy="0">kagent Dapr Agents OpenChoreo</tspan></text><text x="474" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Agents operating Kubernetes,</tspan><tspan x="474" dy="21.6">Prometheus, Istio and Argo;</tspan><tspan x="474" dy="21.6">durable workflows, state, retries</tspan><tspan x="474" dy="21.6">and SPIFFE identity; one platform</tspan><tspan x="474" dy="21.6">serving humans and agents through</tspan><tspan x="474" dy="21.6">different interfaces</tspan></text><rect x="830" y="230" width="350" height="510" rx="22" fill="#fde8f7" stroke="#d7dbe5"/><text x="854" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="854" dy="0">Connect and govern</tspan></text><text x="854" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="854" dy="0">kgateway agentgateway Istio</tspan></text><text x="854" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="854" dy="0">Control and data planes for LLM,</tspan><tspan x="854" dy="21.6">MCP and agent traffic;</tspan><tspan x="854" dy="21.6">service-mesh and gateway policy</tspan><tspan x="854" dy="21.6">extending toward AI workloads</tspan></text><rect x="1210" y="230" width="350" height="510" rx="22" fill="#e7f5ee" stroke="#d7dbe5"/><text x="1234" y="285" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" text-anchor="start"><tspan x="1234" dy="0">Trace and explain</tspan></text><text x="1234" y="350" fill="#172033" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="1234" dy="0">OpenTelemetry Jaeger</tspan></text><text x="1234" y="500" fill="#667085" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1234" dy="0">Agent, workflow and execute-tool</tspan><tspan x="1234" dy="21.6">semantics; an established tracing</tspan><tspan x="1234" dy="21.6">project adapting its UI and</tspan><tspan x="1234" dy="21.6">protocol layer to agent execution</tspan><tspan x="1234" dy="21.6">paths</tspan></text></svg>